<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Summarizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FBF8F4;
  --surface: #FFFFFF;
  --surface-2: #F6F1EA;
  --text: #231A12;
  --muted: #7A6B5D;
  --line: #E8DFD4;
  --accent: #F97316;
  --accent-hover: #EA580C;
  --accent-soft: #FFEDD5;
  --danger: #B42318;
  --danger-soft: #FEE4E2;
  --shadow: 0 1px 2px rgba(35,26,18,.05), 0 8px 24px rgba(35,26,18,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17120E;
    --surface: #211A14;
    --surface-2: #2A2119;
    --text: #F5EDE4;
    --muted: #A4937F;
    --line: #3A2F25;
    --accent: #FB923C;
    --accent-hover: #FDA25B;
    --accent-soft: #3A2411;
    --danger: #FDA29B;
    --danger-soft: #3B1714;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
}
* { box-sizing: border-box; }
html { color-scheme: light dark; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  line-height: 1.55;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 48px 24px 64px; }

header { margin-bottom: 32px; max-width: 620px; }
h1 {
  font-family: "Bricolage Grotesque", "DM Sans", system-ui, sans-serif;
  font-size: clamp(2rem, 5vw, 3rem);
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin: 0 0 12px;
}
header p { margin: 0; color: var(--muted); font-size: 1.05rem; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: stretch; }
@media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  min-height: 420px;
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  min-height: 56px;
}
.panel-head h2 { margin: 0; font-size: 1rem; font-weight: 600; }
.tools { display: flex; gap: 6px; }

.ghost {
  background: transparent; color: var(--muted);
  border: 1px solid transparent; border-radius: 8px;
  padding: 6px 10px; font: inherit; font-size: .875rem; cursor: pointer;
  transition: background .15s, color .15s;
}
.ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.ghost:disabled { opacity: .4; cursor: not-allowed; }

textarea {
  flex: 1;
  width: 100%;
  resize: none;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 1rem;
  padding: 18px;
  min-height: 260px;
}
textarea::placeholder { color: var(--muted); opacity: .8; }

.panel-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 18px;
  border-top: 1px solid var(--line);
}
.count { color: var(--muted); font-size: .875rem; }
.hint { color: var(--muted); font-size: .8rem; }

.primary {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--accent); color: #fff;
  border: 0; border-radius: 10px;
  padding: 10px 20px; font: inherit; font-weight: 600; cursor: pointer;
  transition: background .15s, transform .05s;
}
.primary:hover:not(:disabled) { background: var(--accent-hover); }
.primary:active:not(:disabled) { transform: translateY(1px); }
.primary:disabled { opacity: .6; cursor: not-allowed; }

:is(button, textarea):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
textarea:focus-visible { outline-offset: -4px; border-radius: 12px; }

.spinner {
  width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
  animation: spin .7s linear infinite; display: none;
}
.loading .spinner { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

.output { flex: 1; padding: 18px; display: flex; flex-direction: column; }
.empty { margin: auto; text-align: center; color: var(--muted); max-width: 260px; }
.empty svg { width: 40px; height: 40px; margin-bottom: 10px; color: var(--accent); }

.result { font-size: 1.05rem; line-height: 1.65; white-space: pre-wrap; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 16px; }
.chip {
  background: var(--accent-soft); color: var(--text);
  border-radius: 999px; padding: 4px 12px; font-size: .8rem; font-weight: 500;
}

.error {
  background: var(--danger-soft); color: var(--danger);
  border-radius: 10px; padding: 12px 14px; font-size: .95rem;
}

.skeleton span {
  display: block; height: 14px; border-radius: 6px; margin-bottom: 12px;
  background: linear-gradient(90deg, var(--surface-2) 25%, var(--line) 50%, var(--surface-2) 75%);
  background-size: 200% 100%; animation: shimmer 1.2s infinite linear;
}
.skeleton span:nth-child(2) { width: 92%; }
.skeleton span:nth-child(3) { width: 78%; }
.skeleton span:nth-child(4) { width: 55%; }
@keyframes shimmer { to { background-position: -200% 0; } }

[hidden] { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  .spinner, .skeleton span { animation: none; }
  * { transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Text Summarizer</h1>
    <p>Paste an article, email or conversation and get a short summary, generated by a fine-tuned T5 model running on your machine.</p>
  </header>

  <main class="grid">
    <section class="panel" aria-labelledby="in-title">
      <div class="panel-head">
        <h2 id="in-title">Your text</h2>
        <div class="tools">
          <button type="button" class="ghost" id="sample-btn">Try a sample</button>
          <button type="button" class="ghost" id="clear-btn" disabled>Clear</button>
        </div>
      </div>

      <form id="summarization-form" style="display:contents">
        <textarea id="dialogue-input" placeholder="Write or paste your content here…" aria-label="Text to summarize" required></textarea>
        <div class="panel-foot">
          <div>
            <div class="count" id="count">0 words</div>
            <div class="hint">Ctrl + Enter to summarize</div>
          </div>
          <button type="submit" class="primary" id="submit-btn" disabled>
            <span class="spinner" aria-hidden="true"></span>
            <span id="btn-label">Summarize</span>
          </button>
        </div>
      </form>
    </section>

    <section class="panel" aria-labelledby="out-title">
      <div class="panel-head">
        <h2 id="out-title">Summary</h2>
        <div class="tools">
          <button type="button" class="ghost" id="copy-btn" disabled>Copy</button>
        </div>
      </div>

      <div class="output" id="output" aria-live="polite">
        <div class="empty" id="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <path d="M4 6h16M4 12h10M4 18h6"/>
          </svg>
          <div>Your summary will appear here.</div>
        </div>
        <div class="skeleton" id="skeleton" hidden>
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="result" id="summary-text" hidden></div>
        <div class="error" id="error" role="alert" hidden></div>
        <div class="stats" id="stats" hidden></div>
      </div>
    </section>
  </main>
</div>

<script>
const form = document.getElementById("summarization-form");
const input = document.getElementById("dialogue-input");
const submitBtn = document.getElementById("submit-btn");
const btnLabel = document.getElementById("btn-label");
const clearBtn = document.getElementById("clear-btn");
const sampleBtn = document.getElementById("sample-btn");
const copyBtn = document.getElementById("copy-btn");
const countEl = document.getElementById("count");

const el = {
  empty: document.getElementById("empty"),
  skeleton: document.getElementById("skeleton"),
  result: document.getElementById("summary-text"),
  error: document.getElementById("error"),
  stats: document.getElementById("stats"),
};

const SAMPLE = `Reporter: Cities keep breaking heat records. What's driving that?
Dr. Rao: Two things. Global warming raises the baseline, and the urban heat island effect adds to it. Concrete and asphalt absorb heat all day and release it at night, so cities can run five to ten degrees hotter than nearby rural areas.
Reporter: What can cities do about it?
Dr. Rao: Planting trees is the most effective low-cost option. A mature canopy can lower surface temperatures by several degrees. Cool roofs help too, but trees also improve air quality.
Reporter: What's your advice to planners?
Dr. Rao: Start with the hottest, most vulnerable neighborhoods and protect the trees you already have.`;

const wordCount = (s) => (s.trim() ? s.trim().split(/\s+/).length : 0);

function show(which) {
  for (const key of Object.keys(el)) el[key].hidden = key !== which && !(which === "result" && key === "stats");
}

function updateInputState() {
  const n = wordCount(input.value);
  countEl.textContent = n + (n === 1 ? " word" : " words");
  submitBtn.disabled = n === 0;
  clearBtn.disabled = input.value.length === 0;
}

function setLoading(on) {
  submitBtn.classList.toggle("loading", on);
  submitBtn.disabled = on || wordCount(input.value) === 0;
  btnLabel.textContent = on ? "Summarizing…" : "Summarize";
}

input.addEventListener("input", updateInputState);

input.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
    e.preventDefault();
    form.requestSubmit();
  }
});

sampleBtn.addEventListener("click", () => {
  input.value = SAMPLE;
  updateInputState();
  input.focus();
});

clearBtn.addEventListener("click", () => {
  input.value = "";
  updateInputState();
  copyBtn.disabled = true;
  show("empty");
  input.focus();
});

copyBtn.addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(el.result.textContent);
    copyBtn.textContent = "Copied";
  } catch {
    copyBtn.textContent = "Copy failed";
  }
  setTimeout(() => (copyBtn.textContent = "Copy"), 1500);
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const dialogue = input.value.trim();
  if (!dialogue) return;

  setLoading(true);
  copyBtn.disabled = true;
  show("skeleton");

  try {
    const response = await fetch("/summarize/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ dialogue }),
    });
    if (!response.ok) throw new Error("The server returned status " + response.status + ".");

    const data = await response.json();
    const summary = (data.summary || "").trim();
    if (!summary) throw new Error("The model returned an empty summary. Try a longer or clearer text.");

    el.result.textContent = summary;
    const inWords = wordCount(dialogue);
    const outWords = wordCount(summary);
    const saved = Math.max(0, Math.round((1 - outWords / inWords) * 100));
    el.stats.innerHTML = "";
    for (const label of [inWords + " words in", outWords + " words out", saved + "% shorter"]) {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = label;
      el.stats.appendChild(chip);
    }
    show("result");
    copyBtn.disabled = false;
  } catch (err) {
    el.error.textContent = err.message + " Check that the server is running and try again.";
    show("error");
  } finally {
    setLoading(false);
  }
});

updateInputState();
</script>
</body>
</html>
